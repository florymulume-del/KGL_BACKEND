<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>

  <!-- Page styling -->
  <style>
    /* Body centered layout */
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* full viewport height */
    }

    /* Form container */
    .container {
      background: white;
      padding: 30px;
      width: 350px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* subtle shadow */
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Input fields styling */
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Button styling */
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    /* Message box for success/error messages */
    .message {
      margin-top: 10px;
      text-align: center;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Change Password</h2>

  <!-- Form for entering new password -->
  <form id="changePasswordForm">
    <input type="password" id="newPassword" placeholder="New Password" required />
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
    <button type="submit">Update Password</button>
  </form>

  <!-- Message display -->
  <div id="message" class="message"></div>
</div>

<script>
  // Backend API URL
  const API_URL = "https://kgl-backend-4.onrender.com"; 

  const form = document.getElementById("changePasswordForm");
  const messageDiv = document.getElementById("message");

  // Check if user is authenticated
  const token = localStorage.getItem("token");
  if (!token) {
    // Redirect to login if no token
    window.location.href = "index.html";
  }

  // Form submission handler
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); // Prevent default form submission

    // Get input values
    const newPassword = document.getElementById("newPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    // Validation: minimum password length
    if (newPassword.length < 6) {
      showMessage("Password must be at least 6 characters", "error");
      return;
    }

    // Validation: passwords must match
    if (newPassword !== confirmPassword) {
      showMessage("Passwords do not match", "error");
      return;
    }

    try {
      // Send POST request to change password endpoint
      const response = await fetch(`${API_URL}/users/change-password`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ newPassword })
      });

      const data = await response.json();

      if (!response.ok) {
        // Show backend error message
        showMessage(data.message || "Error updating password", "error");
        return;
      }

      // Success message
      showMessage("Password updated successfully!", "success");

      // Clear token and force user to login again after short delay
      setTimeout(() => {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }, 1500);

    } catch (error) {
      // Handle network/server errors
      showMessage("Server error", "error");
    }
  });

  // Utility function to show messages
  function showMessage(msg, type) {
    messageDiv.textContent = msg;
    messageDiv.className = "message " + type; // Adds either "success" or "error" class
  }
</script>

</body>
</html>
