<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karibu Grocery Ltd | Secure Login</title>

    <!-- ================= MAIN STYLES ================= -->
    <link rel="stylesheet" href="index.css" />

    <!-- ================= ICONS ================= -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= PAGE BACKGROUND & LAYOUT ================= -->
    <div class="page-bg">
      <div class="login-container">

        <!-- ================= LEFT PANEL ================= -->
        <div class="login-left">
          <div class="overlay">
            <div class="left-content">
              <!-- Company Logo -->
              <img src="images/logo.png" alt="Karibu Grocery" class="logo" />

              <!-- Company Title -->
              <h1>Karibu <span>Grocery</span> Ltd</h1>

              <!-- Description -->
              <p>
                Secure staff access for sales, procurement, reporting and
                role-based system control.
              </p>

              <!-- Key Features / Security Highlights -->
              <div class="features">
                <div>
                  <i class="fa-solid fa-user-shield"></i> Role-Based Access
                </div>
                <div>
                  <i class="fa-solid fa-chart-line"></i> Real-Time Operations
                </div>
                <div>
                  <i class="fa-solid fa-lock"></i> Secure Authentication
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ================= RIGHT PANEL (LOGIN FORM) ================= -->
        <div class="login-right">
          <div class="login-card">
            <!-- Form Header -->
            <h2>Secure Login</h2>
            <p class="subtitle">Authorized staff only</p>

            <!-- ================= LOGIN FORM ================= -->
            <form id="login-form">
              <!-- USERNAME / EMAIL -->
              <div class="form-group">
                <label>
                  <i class="fa-solid fa-user"></i>
                  Username or Email
                </label>
                <input
                  type="text"
                  id="username"
                  placeholder="Enter username or email"
                  required
                />
              </div>

              <!-- PASSWORD -->
              <div class="form-group">
                <label>
                  <i class="fa-solid fa-lock"></i>
                  Password
                </label>

                <!-- Password input with toggle visibility -->
                <div class="password-wrapper">
                  <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                  />
                  <i class="fa-solid fa-eye toggle" id="togglePassword"></i>
                </div>
              </div>

              <!-- LOGIN BUTTON -->
              <button type="submit" class="login-btn" id="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
              </button>
            </form>

            <!-- FOOTER NOTE -->
            <p class="footer-text">
              Accounts are created by the system administrator
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= TOAST NOTIFICATIONS ================= -->
    <div id="toast"></div>

    <!-- ================= LOGIN SCRIPT ================= -->
    <!-- Handles login submission, validation, password toggle, and toast messages -->
    <script src="login.js"></script>
  </body>
</html>
